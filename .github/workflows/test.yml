name: Test Windows and Linux
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python test_installer.py
      - run: python test_windows_launcher.py
      - run: python verify_release.py
      - run: node --test src/catalog.test.cjs src/router.test.cjs src/router.integration.test.cjs src/multimodal.test.cjs
      - run: node --check src/router.cjs
      - name: Enable Linux user service session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Test real Linux service lifecycle
        if: runner.os == 'Linux'
        run: python test_service.py
